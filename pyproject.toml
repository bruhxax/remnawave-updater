[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remnawave-updater"
version = "0.2.0"
description = "Bilingual CLI update manager for Remnawave Panel, Nodes and Subscription Page"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Remnawave Updater contributors"}]
dependencies = []
keywords = ["remnawave", "vpn", "docker", "updater", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
remnawave-updater = "remnawave_updater.cli:main"

[tool.setuptools.packages.find]
include = ["remnawave_updater*"]
